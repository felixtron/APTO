name: Deploy APTO to Production (VPS-2)

on:
  workflow_run:
    workflows: ["Build and push image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Deploy to panel-prosuite-2 (Worker)
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST || '195.26.255.71' }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '2226' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
        run: |
          set -e
          if [ -z "$SSH_KEY" ]; then
            echo "::error::Missing DEPLOY_SSH_KEY secret"
            exit 1
          fi
          
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          
          export SSH_HOST="$SSH_HOST"
          export SSH_PORT="$SSH_PORT"
          export DEPLOY_USER="$DEPLOY_USER"
          
          # Execute deploy.sh using the latest push SHA
          log_sha=$(git rev-parse --short HEAD)
          echo "Triggering deploy script for commit $log_sha"
          
          # Set executable and run deploy script
          chmod +x ./deploy.sh
          bash ./deploy.sh production "$log_sha"
