version: '3.9'

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: apto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: apto
      POSTGRES_USER: apto
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apto -d apto"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    labels:
      org.prosuite.git-sha: "${COMMIT_SHA:-latest}"
      org.prosuite.client: "apto"
      org.prosuite.role: "postgres"
      org.prosuite.author: "felix"

  # ── APTO Web App (Next.js) ───────────────────────────────────────────────────
  app:
    image: ghcr.io/felixtron/apto:${COMMIT_SHA:-latest}
    container_name: apto-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://apto:${DB_PASSWORD}@db:5432/apto
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      NEXT_PUBLIC_APP_URL: https://${APP_DOMAIN:-apto.org.mx}
      NEXTAUTH_URL: https://${APP_DOMAIN:-apto.org.mx}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      CERTIFICATE_SECRET: ${CERTIFICATE_SECRET:-}
      CRON_SECRET: ${CRON_SECRET:-}

      # Stripe
      STRIPE_MODE: ${STRIPE_MODE:-test}
      STRIPE_LIVE_SECRET_KEY: ${STRIPE_LIVE_SECRET_KEY:-}
      STRIPE_LIVE_WEBHOOK_SECRET: ${STRIPE_LIVE_WEBHOOK_SECRET:-}
      STRIPE_LIVE_PUBLISHABLE_KEY: ${STRIPE_LIVE_PUBLISHABLE_KEY:-}
      STRIPE_TEST_SECRET_KEY: ${STRIPE_TEST_SECRET_KEY:-}
      STRIPE_TEST_WEBHOOK_SECRET: ${STRIPE_TEST_WEBHOOK_SECRET:-}
      STRIPE_TEST_PUBLISHABLE_KEY: ${STRIPE_TEST_PUBLISHABLE_KEY:-}
      STRIPE_TEST_PRICE_STUDENT: ${STRIPE_TEST_PRICE_STUDENT:-}
      STRIPE_TEST_PRICE_PROFESSIONAL: ${STRIPE_TEST_PRICE_PROFESSIONAL:-}
      STRIPE_LIVE_PRICE_STUDENT: ${STRIPE_LIVE_PRICE_STUDENT:-}
      STRIPE_LIVE_PRICE_PROFESSIONAL: ${STRIPE_LIVE_PRICE_PROFESSIONAL:-}

      # Email
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-APTO <contacto@apto.org.mx>}

      # AI
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

      # Storage
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
    networks:
      - internal
      - traefik
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => r.statusCode === 200 ? process.exit(0) : process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.apto.rule=Host(`${APP_DOMAIN:-apto.org.mx}`)"
      - "traefik.http.routers.apto.entrypoints=websecure"
      - "traefik.http.routers.apto.tls=true"
      - "traefik.http.routers.apto.tls.certresolver=letsencrypt"
      - "traefik.http.services.apto.loadbalancer.server.port=3000"
      - "traefik.http.routers.apto-http.rule=Host(`${APP_DOMAIN:-apto.org.mx}`)"
      - "traefik.http.routers.apto-http.entrypoints=web"
      - "traefik.http.routers.apto-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "org.prosuite.git-sha=${COMMIT_SHA:-latest}"
      - "org.prosuite.client=apto"
      - "org.prosuite.role=app"
      - "org.prosuite.author=felix"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    read_only: false  # Next.js standalone server may require writing temp caches unless custom tmpfs is fully wired
    tmpfs:
      - /tmp

volumes:
  postgres_data:
    driver: local

networks:
  internal:
  traefik:
    external: true
